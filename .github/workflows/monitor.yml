name: INDUSTRY external health
on:
  schedule:
    - cron: '3-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: industry-health
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/monitor.mjs
        env:
          MONITOR_API_SECRET: ${{ secrets.MONITOR_API_SECRET }}
